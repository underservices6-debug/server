<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyVault - Admin Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1a1533 0%, #090a10 70%);
    }
    .login-container {
      width: 100%;
      max-width: 380px;
      padding: 32px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .login-alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-1.5 1.5L16 7l-1.5-1.5-3 3 1.5 1.5-2 2-1.5-1.5-2 2 1.5 1.5-3 3a5.5 5.5 0 1 1-7.78-7.78l10-10a5.5 5.5 0 0 1 7.78 7.78z"></path>
        </svg>
      </div>
      <div class="brand-text">
        <h1>KeyVault</h1>
        <p>License manager</p>
      </div>
    </div>

    <div id="login-alert" class="login-alert hidden"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin" value="admin">
      </div>
      <div class="form-group" style="margin-top:12px;">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Password">
      </div>
      <button type="submit" class="btn-submit" style="margin-top:20px;">Sign In to KeyVault</button>
    </form>
  </div>

  <!-- password change modal -->
  <div id="pw-change-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Password Change Required</h3>
      </div>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">
        Your account requires a permanent password before proceeding to the KeyVault dashboard.
      </p>
      <div id="pw-modal-alert" class="login-alert hidden"></div>
      <form id="pw-change-form">
        <div class="form-group">
          <label for="current-pw">Current Password</label>
          <input type="password" id="current-pw" required>
        </div>
        <div class="form-group">
          <label for="new-pw">New Password (minimum 8 characters)</label>
          <input type="password" id="new-pw" minlength="8" required>
        </div>
        <div class="form-group">
          <label for="confirm-pw">Confirm Password</label>
          <input type="password" id="confirm-pw" minlength="8" required>
        </div>
        <button type="submit" class="btn-submit" style="margin-top:10px;">Update Password & Continue</button>
      </form>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const loginAlert = document.getElementById('login-alert');
    const pwModal = document.getElementById('pw-change-modal');
    const pwForm = document.getElementById('pw-change-form');
    const pwAlert = document.getElementById('pw-modal-alert');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginAlert.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed.');
        }

        if (data.must_change_password) {
          document.getElementById('current-pw').value = password;
          pwModal.classList.remove('hidden');
        } else {
          window.location.href = '/';
        }
      } catch (err) {
        loginAlert.textContent = err.message;
        loginAlert.classList.remove('hidden');
      }
    });

    pwForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      pwAlert.classList.add('hidden');

      const current_password = document.getElementById('current-pw').value;
      const new_password = document.getElementById('new-pw').value;
      const confirm_password = document.getElementById('confirm-pw').value;

      if (new_password !== confirm_password) {
        pwAlert.textContent = 'Passwords do not match.';
        pwAlert.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch('/api/v1/admin/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest'
          },
          body: JSON.stringify({ current_password, new_password })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Failed to update password.');
        }

        window.location.href = '/';
      } catch (err) {
        pwAlert.textContent = err.message;
        pwAlert.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
